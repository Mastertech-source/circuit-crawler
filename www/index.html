<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Circuit Crawler</title>
<style>
  body { margin:0; background:#1a1a1a; color:#e8d9b0; font-family:sans-serif; overflow:hidden; }
  #game { display:block; margin:0 auto; background:#0d0d0d; }
  #ui { padding:10px; text-align:center; }
  #log { height:80px; overflow-y:auto; padding:10px; font-size:14px; background:#111; }
  button { padding:10px 20px; font-size:16px; margin:5px; background:#3a2f1a; color:#e8d9b0; border:1px solid #5a4a2a; border-radius:6px; }
</style>
</head>
<body>
<div id="ui">
  <div id="stats">HP: <span id="hp">100</span> | Gold: <span id="gold">0</span> | Banked: <span id="banked">0</span></div>
</div>
<canvas id="game" width="360" height="200"></canvas>
<div id="log"></div>
<div id="ui">
  <button id="retreatBtn">Retreat (bank loot)</button>
  <button id="restartBtn" style="display:none;">Start New Run</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hpEl = document.getElementById('hp');
const goldEl = document.getElementById('gold');
const bankedEl = document.getElementById('banked');
const logEl = document.getElementById('log');
const retreatBtn = document.getElementById('retreatBtn');
const restartBtn = document.getElementById('restartBtn');

let banked = parseInt(localStorage.getItem('banked') || '0');
let hero, tiles, heroPos, gold, running;

function log(msg) {
  const p = document.createElement('div');
  p.textContent = msg;
  logEl.appendChild(p);
  logEl.scrollTop = logEl.scrollHeight;
}

function newRun() {
  hero = { hp: 100, maxHp: 100, atk: 10 };
  tiles = [];
  for (let i = 0; i < 30; i++) tiles.push({ type: i % 3 === 0 ? 'enemy' : 'road' });
  heroPos = 0;
  gold = 0;
  running = true;
  logEl.innerHTML = '';
  restartBtn.style.display = 'none';
  retreatBtn.style.display = 'inline-block';
  log('A new run begins...');
  updateUI();
  draw();
  step();
}

function step() {
  if (!running) return;
  heroPos++;
  if (heroPos >= tiles.length) {
    log('Reached the end! Loot secured.');
    endRun(true);
    return;
  }
  const tile = tiles[heroPos];
  if (tile.type === 'enemy') {
    const enemyHp = 20 + heroPos * 3;
    const enemyAtk = 5 + heroPos;
    let eHp = enemyHp;
    while (eHp > 0 && hero.hp > 0) {
      eHp -= hero.atk;
      if (eHp <= 0) break;
      hero.hp -= enemyAtk;
    }
    if (hero.hp <= 0) {
      hero.hp = 0;
      log('You were slain at tile ' + heroPos + '.');
      updateUI();
      draw();
      endRun(false);
      return;
    } else {
      const drop = 5 + Math.floor(Math.random() * 10);
      gold += drop;
      log('Defeated enemy, found ' + drop + ' gold.');
    }
  }
  updateUI();
  draw();
  setTimeout(step, 2000);
}

function endRun(survived) {
  running = false;
  retreatBtn.style.display = 'none';
  restartBtn.style.display = 'inline-block';
  if (survived) {
    banked += gold;
    localStorage.setItem('banked', banked);
    log('Banked ' + gold + ' gold. Total banked: ' + banked);
  } else {
    log('Run lost. Gold lost: ' + gold);
  }
  updateUI();
}

function retreat() {
  if (!running) return;
  banked += gold;
  localStorage.setItem('banked', banked);
  log('Retreated safely with ' + gold + ' gold banked.');
  endRun(true);
}

function updateUI() {
  hpEl.textContent = hero.hp;
  goldEl.textContent = gold;
  bankedEl.textContent = banked;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const tileW = 30;
  for (let i = 0; i < tiles.length; i++) {
    const x = i * tileW - (heroPos * tileW) + canvas.width/2;
    if (x < -tileW || x > canvas.width) continue;
    ctx.fillStyle = tiles[i].type === 'enemy' ? '#7a2e2e' : '#3a3a2a';
    ctx.fillRect(x, 90, tileW-4, 30);
  }
  ctx.fillStyle = '#e8d9b0';
  ctx.beginPath();
  ctx.arc(canvas.width/2 + tileW/2 - 2, 105, 10, 0, Math.PI*2);
  ctx.fill();
}

retreatBtn.onclick = retreat;
restartBtn.onclick = newRun;
newRun();
</script>
</body>
</html>
